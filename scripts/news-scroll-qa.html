<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0"><div id="root"></div><script type="module">
// Isolated visual/scroll fixture: the real News page and application layout,
// with no authenticated session or business mutations.
import React from 'react';
import ReactDOM from 'react-dom/client';
import {MemoryRouter,Routes,Route} from 'react-router-dom';
import RefreshRuntime from '/@react-refresh';
RefreshRuntime.injectIntoGlobalHook(window);
window.$RefreshReg$=()=>{}; window.$RefreshSig$=()=>type=>type;
window.__vite_plugin_react_preamble_installed__=true;
await import('/src/index.css');
await import('/node_modules/@fontsource/anton/index.css');
const {stageClient}=await import('/src/api/stageClient.js');
const player={id:'qa-player',user_id:'qa-user',gamertag:'Dashboard Test',position:'CDM',platform:'PlayStation',club_id:'qa-club',stc:50200,credits:50,created_date:'2026-01-01'};
const club={id:'qa-club',name:'Test Club',tag:'TEST',region:'Europe'};
const user={id:'qa-user',email:'dashboard@example.test',player_id:player.id,role_id:1};
for(const entity of Object.values(stageClient.entities)) {
  entity.filter=async()=>[]; entity.list=async()=>[]; entity.get=async()=>null;
  entity.subscribe=()=>()=>{};
}
stageClient.auth.me=async()=>user;
stageClient.auth.hasToken=()=>false;
stageClient.auth.isAuthenticated=async()=>false;
stageClient.entities.Player.get=async()=>player;
stageClient.entities.Player.filter=async()=>[player];
stageClient.entities.Club.get=async()=>club;
stageClient.entities.Match.filter=async()=>[0,1,2,3,4,5].map(i=>({id:`match-${i}`,status:i<3?'completed':'scheduled',home_player_id:player.id,away_player_id:'opponent',home_club_id:club.id,home_club_name:club.name,away_club_name:'Next Opponent',home_score:2,away_score:1,scheduled_date:`2026-11-${10+i}T20:00:00Z`}));
stageClient.entities.MatchPlayerStat.filter=async()=>[{id:'stat',player_id:player.id,rating:7.5,goals:1,created_date:new Date().toISOString()}];
stageClient.entities.ObjectiveProgress.filter=async()=>[{id:'objective',title:'Play three matches',def_target:3,current_value:1,reward_stc:100}];
stageClient.entities.Tournament.list=async()=>[{id:'qa-tournament',name:'Test Tournament',status:'open',registered_players:[player.id],participant_type:'player'}];
stageClient.http.get=async path=>path.includes('/news')?{stories:Array.from({length:12},(_,i)=>({id:`story-${i}`,kind:'app_update',title:`STAGE headline ${i+1}`,body:'Latest updates from the competition and your club. This is isolated scroll QA content.',published_at:'2026-11-16T10:00:00Z',related_links:[]})),total:12,has_more:false,has_club:true}:{};
stageClient.http.post=async()=>({});
stageClient.functions.invoke=async()=>({});
const {AuthProvider}=await import('/src/lib/AuthContext.jsx');
const {TranslationProvider}=await import('/src/lib/TranslationContext.jsx');
const {default:Layout}=await import('/src/components/Layout.jsx');
const {default:Dashboard}=await import('/src/pages/News.jsx');
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(MemoryRouter,{initialEntries:['/news']},
    React.createElement(TranslationProvider,null,React.createElement(AuthProvider,null,
      React.createElement(Routes,null,React.createElement(Route,{element:React.createElement(Layout)},
        React.createElement(Route,{path:'/news',element:React.createElement(Dashboard)})))))));

const run=document.createElement('button');run.textContent='Run News scroll check';Object.assign(run.style,{position:'fixed',bottom:'12px',right:'12px',zIndex:99999,background:'#fff',color:'#000',padding:'12px'});document.body.append(run);
run.onclick=async()=>{
 const scroller=document.querySelector('.stage-times');const target=document.querySelector('.stage-times-hero h1');
 scroller.scrollTo({top:0,behavior:'instant'});await new Promise(r=>setTimeout(r,100));
 for(let i=0;i<30;i++){target.dispatchEvent(new WheelEvent('wheel',{deltaY:16,bubbles:true,cancelable:true}));await new Promise(requestAnimationFrame);}
 await new Promise(r=>setTimeout(r,350));
 const traveled=scroller.scrollTop;run.textContent=`${traveled>=430?'PASS':'FAIL'}: News moved ${traveled}px of 480px`;
};
</script></body></html>
